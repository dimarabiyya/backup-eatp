<div class="widget" id="siteList">
	<div class="widget-head heading-outer">
		<h4 class="heading glyphicons list"><i></i> {{ title }}</h4>
			
	</div>
	
	<div class="widget-body">
		<div id="tbPo" style="padding: 3px 0px 0px 0px; height:auto">
			<div class="row-fluid">
				<div class="span6">	
					<div class="span12">				
						<div class="span6">
							<div class="input-prepend">
								<span class="add-on">Region</span>
								<select id="regions" >
									<option value="">All</option>
									<option ng-repeat="(i, v) in regions" value="{{ i }}">{{ v }}</option>

								</select>
							</div>
						</div>
					</div>
				</div>								
			</div>
			<div class="row-fluid">
				<div class="span6">
					<div class="input-prepend">
						<span class="add-on">Schedule Date From</span>
						<input type="text" id="schDateFrom" class="input-small date" placeholder="DD-MMM-YYYY" />
					</div>
					&nbsp;&nbsp;-&nbsp;&nbsp;
					<div class="input-prepend">
						<span class="add-on">To</span>
						<input type="text" id="schDateTo" class="input-small date" placeholder="DD-MMM-YYYY" />
					</div>
					<a href="javascript:void(0)" class="btn btn-default" style="margin-top:-10px;" ng-click="filterDate()">Filter&nbsp;<i class="icon-search"></i></a>
				<div style="margin-top:-10px;"> <button type="button" id="refresh" class="btn btn-default" > Refresh </button></div>
                                </div>
					
				<div class="span6">
					<div class="input-append pull-right">
						<input type="text" id="query" class="input-medium" placeholder="Search..." ng-model="searchText" />
						<button class="btn" ng-click="search()" >Search</button>
					</div>
				</div>
			</div>
		</div>		
		<table class="jgrid" id="gridatpdesktop"></table>
	</div>
</div>

<div style="margin-top:-10px;"> <button type="button" id="refresh" class="btn btn-default" > Refresh </button></div>
