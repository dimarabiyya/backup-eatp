<div class="widget">
	<div class="widget-head heading-outer">
		<h4 class="heading glyphicons list"><i></i> {{ title }}</h4>
	</div>
	
	<div class="widget-body">
		<form class="form-horizontal" ng-submit="save()">

			
			<div class="row-fluid" id="choose-po"> 
                <div class="span12">
                  <div class="control-group">
                    <label class="control-label" for="site">Choose PO No.</label>
                    <div class="controls">                                          
                         <input type="text" name="po" id="po" ng-model="dataBom.po_no" class="input-medium uneditable">           
                        <input type="hidden" id="input_po_id" ng-model="dataBom.po_id" name="input_po_id" >
                        <button type="button" class="btn" ng-click="lookUpPO()">...</button>
                    </div>
                    <div class="separator bottom"></div>
                  </div>
                </div>
            </div>
			
			<div class="row-fluid">	
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="bomConfig">Config</label>
						<div class="controls">
							<input type="text" id="config" class="input-medium" ng-model="dataBom.config" />
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>

			<div class="row-fluid">	
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="bomCode">Code</label>
						<div class="controls">
							<input type="text" id="code" class="input-medium" ng-model="dataBom.code" />
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>

			<div class="row-fluid">	
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="bomMD">Material Desc</label>
						<div class="controls">
							<input type="text" id="material_description" class="input-medium" ng-model="dataBom.material_description" />
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>

			<div class="row-fluid">	
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="bomQR">Qty Req</label>
						<div class="controls">
							<input type="number" id="qty_requirement" class="input-medium" ng-model="dataBom.qty_requirement" />
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>

			<div class="row-fluid">	
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="bomQP">Qty PO</label>
						<div class="controls">
							<input type="number" id="qty_po" class="input-medium" ng-model="dataBom.qty_po" />
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>
			
			<div class="row-fluid">	
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="bomQA">Qty Actual</label>
						<div class="controls">
							<input type="number" id="qty_actual" class="input-medium" ng-model="dataBom.qty_actual" />
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>
			<div class="row-fluid">	
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="bomSB">Status Boq</label>
						<div class="controls">
							<select id="po_id" ng-model="dataBom.status_boq">
								<option value="">- Choose one -</option>
                                <option ng-repeat="(i,v) in status_boq_options" value="{{ i }}">{{ v }}</option>
							</select>							
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>
			<div class="row-fluid">	
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="bomRemarks">Remarks</label>
						<div class="controls">
							<input type="text" id="remarks" class="input-medium" ng-model="dataBom.remarks" />
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>
			<div class="row-fluid">	
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="bomUom">Uom</label>
						<div class="controls">
							<input type="text" id="uom" class="input-medium" ng-model="dataBom.uom" />
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>
			<div class="row-fluid">	
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="bomLinkID">Link ID</label>
						<div class="controls">
							<select id="link_id_int" ng-model="dataBom.link_id_int">
							</select>
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>
			<div class="form-actions">
				<button class="btn btn-primary btn-icon glyphicons circle_ok"><i></i> Save</button>
				<button type="button" class="btn btn-icon btn-close btn-default glyphicons circle_remove" onclick="window.location.href='#/'"><i></i>Cancel</button>
			</div>
		</form>
	</div>
</div>
