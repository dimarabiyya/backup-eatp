<div class="widget">
	<div class="widget-head heading-outer">
		<h4 class="heading glyphicons list"><i></i> {{ title }}</h4>
	</div>
	
	<div class="widget-body">
		<form class="form-horizontal" ng-submit="save()">
			<div class="row-fluid">	
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="poNo">PO No.</label>
						<div class="controls">
							<input type="text" id="poNo" class="input-medium" ng-model="dataPo.poNo" />
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>
			
			<div class="row-fluid">
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="poDate">PO Date</label>
						<div class="controls">
							<div class="input-append">
								<input type="text" id="poDate" class="input-small date" placeholder="DD-MMM-YYYY" ng-model="dataPo.poDate" />
								<span class="add-on"><i class="icon-calendar"></i></span>
							</div>
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>
			
			<div class="row-fluid">
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="region">Region</label>
						<div class="controls">
							<select id="region" ng-model="dataPo.region">
								<option value="">- Choose one -</option>
								<option ng-repeat="(i,v) in regions" value="{{ i }}">{{ v }}</option>
							</select>
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>
			
			<div class="row-fluid" style="margin-bottom: 15px;">
				<div class="span12">
					<div class="pull-right">
						<button type="button" class="btn btn-default" onclick="addOption()"><i class="icon-plus-sign"></i>&nbsp;&nbsp;Add PO LINK</button>

					</div>
				</div>
			</div>
			<div class="row-fluid">
				<div class="span12">					
					<table id="tbl-po_link" class="table table-bordered" style="width:100%">
		              <thead>
		                <tr>
		                  <th style="width:30px" class="center">&nbsp;</th>
		                  <th style="width:200px">LINK <span class="text-error">*</span></th>
		                  <th style="width:100px">Item</th>
		                  <th style="width:100px">Order Type <span class="text-error">*</span></th>
		                  <th class="center">EWO NO.</th>
		                  <th class="center">Type</th>
		                  <th style="width:300px">Description <span class="text-error">*</span></th>		                 
		                </tr>
		              </thead>
		              <tbody id="tbl-user-body">
		              <tr class="row-1">
		              	<td >
		              		<a class="btn btn-danger btn-small btn-remove-row" id="1" href="javascript:void(0)" title="Remove row" onClick="removeRow(this)">
		              			<i class="icon-minus-sign icon-white"></i>
	              			</a>
		              	</td>
		              	<td>
		              		<button class="btn btn-default" onClick="">Choose Link&nbsp;<i class="icon-search"></i></button>
		              		<input type="hidden" id="link1" name="link[]"/>
		              	</td>
		              	<td>
		              		<input  style="width:100px" type="number" name="itemtype[]" />
		              	</td>
		              	<td>
		              		<select name="order_type[]">
		              			<option>- Choose -</option>
		              			<option value="1">NBWO</option>
		              			<option value="2">EWO</option>
		              		</select>
		              	</td>
		              	<td>
		              		<input type="number" name="ewo[]">
		              	</td>
		              	<td>
		              		<input type="text" name="type[]">
		              	</td>
		              	<td>
		              		<textarea style="width: 94%;"  name="description[]"  placeholder="Fill Description" ></textarea>
		              	</td>
		              </tr>
		              
		              </tbody>
		            </table>
				</div>
			</div>

			<div class="form-actions">
				<button class="btn btn-primary btn-icon glyphicons circle_ok"><i></i> Save</button>
				<button type="button" class="btn btn-icon btn-close btn-default glyphicons circle_remove" onclick="window.location.href='#/'"><i></i>Cancel</button>
			</div>
		</form>
	</div>
</div>
<script>
var current_add = 1;
	function addOption(){
		current_add ++;
		var content = '<tr class="row-'+current_add+'">'+
		              	'<td >'+
		              		'<a class="btn btn-danger btn-small btn-remove-row" id="'+current_add+'" href="javascript:void(0)" onClick="removeRow(this)" title="Remove row">'+
		              			'<i class="icon-minus-sign icon-white"></i>'+
	              			'</a>'+
		              	'</td>'+
		              	'<td>'+
		              		'<button class="btn btn-default" onClick="">Choose Link&nbsp;<i class="icon-search"></i></button><input type="hidden" id="link'+current_add+'" name="link[]"/>'+
		              	'</td>'+
		              	'<td>'+
		              		'<input  style="width:100px" type="number" name="itemtype[]" />'+
		              	'</td>'+
		              	'<td>'+
		              		'<select name="order_type[]">'+
		              			'<option>- Choose -</option>'+
		              			'<option value="1">NBWO</option>'+
		              			'<option value="2">EWO</option>'+
		              		'</select>'+
		              	'</td>'+
		              	'<td>'+
		              		'<input type="number" name="ewo[]">'+
		              	'</td>'+
		              	'<td>'+
		              		'<input type="text" name="type[]">'+
		              	'</td>'+
		              	'<td>'+
		              		'<textarea style="width: 94%;"  name="description[]"  placeholder="Fill Description" ></textarea>'+
		              	'</td>'+
		              '</tr>';
		
		$("#tbl-po_link tbody").append(content);
	}
	
	function removeRow(param){
		var row_selected = $(param).attr("id");
		console.log("test remove "+row_selected);
		$(".row-"+row_selected).remove();
	}
</script>
