<div class="widget">
	<div class="widget-head heading-outer">
		<h4 class="heading glyphicons list"><i></i> {{ title }}</h4>
	</div>
	
	<div class="widget-body">
		<form class="form-horizontal" ng-submit="save()">

			<div class="row-fluid">	
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="essNo">ESS No.</label>
						<div class="controls">
							<input type="text" id="ess_no" class="input-medium" ng-model="dataEss.ess_no" />
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>

			
			<div class="row-fluid" id="choose-po"> 
                <div class="span12">
                  <div class="control-group">
                    <label class="control-label" for="site">Choose PO No.</label>
                    <div class="controls">                                          
                         <input type="text" name="po" id="po" ng-model="dataEss.po_no" class="input-medium uneditable">           
                        <input type="hidden" id="input_po_id" ng-model="dataEss.po_id" name="input_po_id" >
                        <button type="button" class="btn" ng-click="lookUpPO()">...</button>
                    </div>
                    <div class="separator bottom"></div>
                  </div>
                </div>
            </div>
			
			<div class="row-fluid">
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="item">Ess File</label>
						<div class="controls">
							<input type="file" id="file" class="input-mini just-number" file-model="dataEss.file" />
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>
			
			<div class="form-actions">
				<button class="btn btn-primary btn-icon glyphicons circle_ok"><i></i> Save</button>
				<button type="button" class="btn btn-icon btn-close btn-default glyphicons circle_remove" onclick="window.location.href='#/'"><i></i>Cancel</button>
			</div>
		</form>
	</div>
</div>
