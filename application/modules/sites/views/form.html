<div class="widget">
	<div class="widget-head heading-outer">
		<h4 class="heading glyphicons list"><i></i> {{ title }}</h4>
	</div>

	<div class="widget-body">
		<form class="form-horizontal" ng-submit="save()">
			<div class="row-fluid">
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="siteID">Site ID.</label>
						<div class="controls">
							<input type="text" id="site_id" class="form-control" ng-model="dataSite.site_id" />
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>

			<div class="row-fluid">
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="siteName">Site Name</label>
						<div class="controls">
							<input type="text" id="site_name" class="form-control" ng-model="dataSite.site_name" />
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>

			<div class="row-fluid">
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="Latitude">Latitude</label>
						<div class="controls">
							<input type="text" id="latitude" class="form-control" ng-model="dataSite.latitude" />
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>

			<div class="row-fluid">
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="dinNO">Longitude</label>
						<div class="controls">
							<input type="text" id="longitude" class="form-control" ng-model="dataSite.longitude" />
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>

			<div class="row-fluid">
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="siteAddress">Site Address</label>
						<div class="controls">
							<textarea id="site_address" class="form-control" ng-model="dataSite.site_address">{dataSite.site_address}</textarea>
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>

			<!-- <div class="row-fluid">
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="Region">Region</label>
						<div class="controls">
							<select id="region_id" ng-model="dataSite.region_id">
								<option value="">- Choose one -</option>
								<option ng-repeat="(i,v) in regions" value="{{ i }}">{{ v }}</option>
							</select>
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div> -->

			<div class="row-fluid">
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="Areas">Area</label>
						<div class="controls">
							<select id="region_id" ng-model="dataSite.area_id">
								<option value="">- Choose one -</option>
								<option ng-repeat="(i,v) in areas" value="{{ i }}">{{ v }}</option>
							</select>
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>

			<div class="row-fluid">
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="Areas">Site Type</label>
						<div class="controls">
							<select id="site_type" ng-model="dataSite.site_type">
								<option value="">- Choose one -</option>
								<option ng-repeat="(i,v) in site_types" value="{{ i }}">{{ v }}</option>
							</select>
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>

			<div class="row-fluid">
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="dinNO">Location Id</label>
						<div class="controls">
							<input type="text" id="longitude" class="form-control" ng-model="dataSite.location_id" />
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>

			<div class="row-fluid">
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="Remark">Remark</label>
						<div class="controls">
							<textarea id="remark" class="form-control" ng-model="dataSite.remark"></textarea>
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>

			<div class="form-actions">
				<button class="btn btn-primary btn-icon glyphicons circle_ok"><i></i> Save</button>
				<button type="button" class="btn btn-icon btn-close btn-default glyphicons circle_remove" onclick="window.location.href='#/'"><i></i>Cancel</button>
			</div>
		</form>
	</div>
</div>
