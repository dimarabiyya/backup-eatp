<div class="widget">
	<div class="widget-head heading-outer">
		<h4 class="heading glyphicons list"><i></i> {{ title }}</h4>
	</div>
	
	<div class="widget-body">
		<form class="form-horizontal" ng-submit="save()">
			
			<div class="row-fluid">	
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="fop_name">Approve ?</label>
						<div class="controls">
							<div class="btn-group" data-toggle="buttons-radio" >                  
			                        <button type="button" id="btn_approve" class="btn">Approve</button> 
			                        <button type="button" id="btn_reject" class="btn">Reject</button>
			                        <!-- <button type="button" id="btn_cancel" class="btn">Cancel</button>  -->
		                  	</div>
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>
			<input type="hidden" id="status" ng-model="dataApproval.status" />
			<div id="widget_approve" style="display: none;">
				<!-- <div class="row-fluid">	
					<div class="span12">
						<div class="control-group">
							<label class="control-label" for="fop_name">FOP Name</label>
							<div class="controls">
								<input type="text" id="fop_name" class="form-control" ng-model="dataApproval.fop_name" />
							</div>
							<div class="separator bottom"></div>
						</div>
					</div>
				</div> -->
				<div class="row-fluid">	
					<div class="span12">
	                  <div class="control-group">
	                    <label class="control-label" for="pic">FOP Name</label>
	                    <div class="controls">
	                       <input type="text" name="user" id="user" class="input-medium uneditable" >           
	                        <input type="hidden" id="input_user_id" name="fop" />
	                        <button type="button" class="btn" ng-click="lookup_fop()">...</button>
	                    </div>
	                    <div class="separator bottom"></div>
	                  </div>
	                </div>
	            </div>
				<div class="row-fluid">	
					<div class="span12">
						<div class="control-group">
							<label class="control-label" for="fop_contact">FOP Contact</label>
							<div class="controls">
								<input type="text" id="fop_contact" class="form-control" ng-model="dataApproval.fop_contact" />
							</div>
							<div class="separator bottom"></div>
						</div>
					</div>
				</div>
			</div>
			<div id="widget_reject" style="display: none;">
				<div class="row-fluid">	
					<div class="span12">
						<div class="control-group">
							<label class="control-label" for="fop_contact">Proposed Date</label>
							<div class="controls">
								<input type="text" id="proposed_date" class="input-small date" placeholder="DD-MMM-YYYY" ng-model="dataApproval.proposed_date" />
							</div>
							<div class="separator bottom"></div>
						</div>
					</div>
				</div>
				<div class="row-fluid">	
					<div class="span12">
						<div class="control-group">
							<label class="control-label" for="siteID">Re-Schedule Reason</label>
							<div class="controls">
								<textarea class="form-control" ng-model="dataApproval.reschedule_reason"></textarea>
							</div>
							<div class="separator bottom"></div>
						</div>
					</div>
				</div>
			</div>

			<!-- <div id="widget_cancellation" style="display: none;">
				<div class="row-fluid">	
					<div class="span12">
						<div class="control-group">
							<label class="control-label" for="fop_contact">Cancellation Remark</label>
							<div class="controls">
								<textarea id="txt_cancellation_remark" ng-model="dataApproval.cancellationRemark"></textarea>
							</div>
							<div class="separator bottom"></div>
						</div>
					</div>
				</div>
			</div> -->

			<div class="row-fluid">	
				<div class="span12">
					<div class="control-group">
						<label class="control-label" for="siteID">Remarks</label>
						<div class="controls">
							<textarea class="form-control" ng-model="dataApproval.remarks"></textarea>
						</div>
						<div class="separator bottom"></div>
					</div>
				</div>
			</div>
			<div class="row-fluid">
				<div class="span12">
					<label class="control-label" for="siteID"></label>
					<div class="controls">
						<p id="fop_choosen" class="badge badge-info"></p>
					</div>					
				</div>
			</div>

			<div class="form-actions">
				<button class="btn btn-primary btn-icon glyphicons circle_ok"><i></i> Save</button>
				<button type="button" class="btn btn-icon btn-close btn-default glyphicons circle_remove" onclick="window.location.href='#/'"><i></i>Cancel</button>
			</div>
		</form>
	</div>
</div>
<script>
	/*When Button Approve Clicked*/
	$("#btn_approve").click(function(){
		$("#widget_approve").show();
		$("#widget_reject").hide();
		// $("#widget_cancellation").hide();
		$("#status").val(1);
	});
	/*When Button Reject Clicked*/
	$("#btn_reject").click(function(){
		$("#widget_approve").hide();
		$("#widget_reject").show();
		// $("#widget_cancellation").hide();
		$("#status").val(0);
	});
	/*When Button Cancel Clicked*/
	// $("#btn_cancel").click(function(){
	// 	$("#widget_approve").hide();
	// 	$("#widget_reject").hide();
	// 	$("#widget_cancellation").show();
	// 	$("#status").val(2);
	// });
	
	
</script>
